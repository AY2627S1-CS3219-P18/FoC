# ---------------------------------------------------------------------------------
# KNOWN GAP: no TLS. This server listens on plain HTTP only.
#
# With the single-EC2 deployment this file is the production edge, so every access
# token, refresh cookie and password crosses the network in clear text. Terminate
# certificates either here (certbot, adding a `listen 443 ssl` server and an HTTP
# redirect) or in front of this container (an ALB). See the README's "Known gap: no
# TLS". Unowned as of 2026-11-04.
# ---------------------------------------------------------------------------------

# Docker's embedded DNS. Resolving upstreams at request time rather than at startup
# matters here: with a literal `proxy_pass http://user-service:3001`, nginx resolves
# every upstream once while loading the config and REFUSES TO START if any one of them
# is not yet in DNS. That would make the frontend container depend on all four backends
# being up before it could serve even a static asset. With a variable, resolution is
# deferred to the request, so nginx boots regardless and a backend that is down affects
# only the calls that need it.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # Dual-stack. Inside the container `localhost` resolves to ::1 only, so an
    # IPv4-only listener makes the healthcheck — and anything else addressing the
    # container by name — fail with "connection refused" while the port works fine
    # from outside. On EC2 it also means an IPv6 client is served rather than refused.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck. Not /health: that name is taken by the backends' own
    # endpoints, and this one must never be proxied.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API proxies -------------------------------------------------------------
    # Mirrors frontend/vite.config.js exactly:
    #   /api/v1    -> supplier-service   /auth, /users, /admin/audit-logs -> user-service
    #   /credits   -> credit-service     /orders       -> order-service
    #   /socket.io -> order-service (WebSocket upgrade)
    #
    # Each upstream goes through a variable so the resolver above applies. nginx does
    # not append the request URI when proxy_pass contains a variable, so $request_uri
    # is explicit — without it every proxied call would arrive at the backend as "/".

    location /api/v1 {
        set $upstream_supplier http://supplier-service:3002;
        proxy_pass $upstream_supplier$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /auth {
        set $upstream_user http://user-service:3001;
        proxy_pass $upstream_user$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /users {
        set $upstream_user http://user-service:3001;
        proxy_pass $upstream_user$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /admin/audit-logs {
        set $upstream_user http://user-service:3001;
        proxy_pass $upstream_user$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /credits {
        set $upstream_credit http://credit-service:3003;
        proxy_pass $upstream_credit$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /chat/conversations {
        set $upstream_chat http://chat-service:3000;
        proxy_pass $upstream_chat$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /orders {
        set $upstream_order http://order-service:3000;
        proxy_pass $upstream_order$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Socket.IO needs the HTTP/1.1 upgrade handshake and must not time out between
    # events; order-service disconnects clients at token expiry and they reconnect.
    location /chat-socket.io {
        set $upstream_chat http://chat-service:3000;
        proxy_pass $upstream_chat$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /socket.io {
        set $upstream_order http://order-service:3000;
        proxy_pass $upstream_order$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- static assets -----------------------------------------------------------
    # Vite emits content-hashed filenames into /assets, so they can be cached hard.
    # A miss here is a genuine 404 rather than the SPA fallback: serving index.html
    # for a missing .js would hand the browser HTML with a JavaScript content type.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback ---------------------------------------------------------------
    # Client-side routes (/wallet, /admin/suppliers, /orders/:id …) exist only in the
    # React router, so a direct hit or a refresh on one must return index.html and let
    # the app route it. Without this they are 404s from nginx.
    #
    # index.html itself is never cached, so a deploy is picked up on the next load
    # rather than being pinned by a stale copy pointing at hashed assets that are gone.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
