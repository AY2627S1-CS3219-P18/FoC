# Scope: Local-development-only MinIO instance that simulates the cloud object storage behind the
#        photo-storage interface (SupplierServiceArchitecture.md §8.2, §9 item 21). Kept out of the
#        root compose.yaml on the team's instruction because it is not used in deployment. The
#        service and container names, host ports (9000 API, 9001 console), bucket name
#        `supplier-photos` and the dev-only default credentials are implementation values chosen by
#        the AI tool. No requirements, architecture, schema, or API decisions were made by the AI
#        tool.
