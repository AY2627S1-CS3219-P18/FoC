# Run from supplier-service/:  docker compose -f compose.photo-store.yaml up -d
services:
  photo-store:
    image: minio/minio
    container_name: foc-supplier-photo-store
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PHOTO_STORE_ACCESS_KEY:-photostoredev}
      MINIO_ROOT_PASSWORD: ${PHOTO_STORE_SECRET_KEY:-photostoredev-secret}
    ports:
      - "${PHOTO_STORE_API_PORT:-9000}:9000"
      - "${PHOTO_STORE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - photo-store-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job that creates the bucket once the store is healthy.
  photo-store-init:
    image: minio/mc
    depends_on:
      photo-store:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://photo-store:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/supplier-photos
      "
    environment:
      MINIO_ROOT_USER: ${PHOTO_STORE_ACCESS_KEY:-photostoredev}
      MINIO_ROOT_PASSWORD: ${PHOTO_STORE_SECRET_KEY:-photostoredev-secret}

volumes:
  photo-store-data:
