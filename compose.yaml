# AI Assistance Disclosure:
# Tool: Claude Code (model: claude-opus-5-5), date: 2026-09-23
# Scope: Project scaffolding / infrastructure only (order-service + its DB).
#        No requirements, architecture, schema, or API decisions were made by the AI tool.
# Author review: george-yeo
# Scope (2026-09-30, Claude Code, model: claude-sonnet-5-5): added the supplier-worker service and the
#        PHOTO_STORE_* env lines / extra_hosts on supplier-service per Phase 4 plan Task 14. No
#        requirements, architecture, schema, or API decisions were made by the AI tool.
# Author review:
#
# Production-like:  docker compose up --build
# Dev (hot reload): docker compose -f compose.yaml -f compose.dev.yaml up --build --watch

name: foc

services:
  # ---- order-service ----------------------------------------------------------
  order-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_DB_USER:?set ORDER_DB_USER in .env}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      POSTGRES_DB: ${ORDER_DB_NAME:?set ORDER_DB_NAME in .env}
    ports:
      - "${ORDER_DB_PORT:-5433}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: ./order-service
      target: production
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@order-db:5432/${ORDER_DB_NAME}
    ports:
      - "${ORDER_SERVICE_PORT:-3002}:3000"
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---- user-service -------------------------------------------------------
  # AI Assistance Disclosure:
  # Tool: Claude Code (claude-sonnet-5), date: 2026-09-24
  #   24/09/2026: Stage 3b - user-db + user-service compose services
  #     Author review: No changes needed. 
  #   26/09/2026: Stage 7 - publish user-db on host port 5434 for the test suite (REVERSE BEFORE DEPLOY)
  #     Author review:
  user-db:
    image: postgres:16-alpine
    container_name: foc-user-db
    restart: unless-stopped
    # Must match DB_USER / DB_PASSWORD / DB_NAME in user-service/.env — Compose
    # variable interpolation can't read values out of a service's own env_file,
    # so these are set directly rather than via ${DB_USER}-style substitution.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service
    # TEMPORARY (Stage 7): lets host-run Vitest reach the DB. Remove before deploying; see instructions.md.
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
      - ./user-service/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: ./user-service
      target: dev
    container_name: foc-user-service
    restart: unless-stopped
    env_file: ./user-service/.env
    ports:
      - "3001:3001"
    volumes:
      - ./user-service/src:/app/src
      - ./user-service/keys:/app/keys
    depends_on:
      user-db:
        condition: service_healthy

  # ---- credit-service ---------------------------------------------------------
  # AI Assistance Disclosure:
  # Tool: Claude Code (model: claude-opus-5), date: 2026-09-26
  #   2026-09-26: Recess iteration - credit-db + credit-service compose services.
  #     No requirements, architecture, schema, or API decisions were made by the AI tool.
  #     Author review:
  credit-db:
    image: postgres:16-alpine
    container_name: foc-credit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CREDIT_DB_USER:?set CREDIT_DB_USER in .env}
      POSTGRES_PASSWORD: ${CREDIT_DB_PASSWORD:?set CREDIT_DB_PASSWORD in .env}
      POSTGRES_DB: ${CREDIT_DB_NAME:?set CREDIT_DB_NAME in .env}
    ports:
      - "${CREDIT_DB_PORT:-5435}:5432"
    volumes:
      - credit-db-data:/var/lib/postgresql/data
      # The postgres image runs this on first start of an empty volume, the same way
      # user-db loads its schema. Schema changes need the volume recreated.
      - ./credit-service/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  credit-service:
    build:
      context: ./credit-service
      target: dev
    container_name: foc-credit-service
    init: true
    restart: unless-stopped
    # credit-service/src/config.ts validates these at startup and exits if any is missing.
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: credit-db
      DB_PORT: 5432
      DB_NAME: ${CREDIT_DB_NAME}
      DB_USER: ${CREDIT_DB_USER}
      DB_PASSWORD: ${CREDIT_DB_PASSWORD}
    ports:
      - "${CREDIT_SERVICE_PORT:-3003}:3003"
    volumes:
      - ./credit-service/src:/app/src
    depends_on:
      credit-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---- supplier-service ---------------------------------------------------
  # AI Assistance Disclosure:
  # Tool: Claude Code (model: claude-sonnet-5), date: 2026-09-29
  # Scope: Added supplier-db, supplier-redis, and supplier-service compose services, mirroring the
  #        credit-service block, using the already-decided MySQL/Redis stack
  #        (supplier-service/AGENTS.md) and the env vars already recorded in
  #        supplier-service/.env.example. No requirements, architecture, schema, or API decisions
  #        were made by the AI tool. Host ports were picked as the next free values after the
  #        existing order/user/credit services (service 3004, DB 5436) since MySQL's default 3306 and
  #        order-service's already-claimed 3002 were both taken.
  #     Author review: Congchen
  supplier-db:
    image: mysql:8
    container_name: foc-supplier-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SUPPLIER_DB_PASSWORD:?set SUPPLIER_DB_PASSWORD in .env}
      MYSQL_DATABASE: supplier_service
    ports:
      - "${SUPPLIER_DB_PORT:-5436}:3306"
    volumes:
      - supplier-db-data:/var/lib/mysql
      - ./supplier-service/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  supplier-redis:
    image: redis:7-alpine
    container_name: foc-supplier-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  supplier-service:
    build:
      context: ./supplier-service
      target: dev
    container_name: foc-supplier-service
    restart: unless-stopped
    # supplier-service/src/config.ts validates these at startup and exits if any is missing.
    # No healthcheck: the service has no /health route yet (SupplierServiceArchitecture.md §7.5:
    # health-check endpoints are explicitly deferred).
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: supplier-db
      DB_PORT: 3306
      DB_NAME: supplier_service
      DB_USER: root
      DB_PASSWORD: ${SUPPLIER_DB_PASSWORD}
      REDIS_HOST: supplier-redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:3001
      PHOTO_STORE_ENDPOINT: ${PHOTO_STORE_ENDPOINT:-http://host.docker.internal:9000}
      PHOTO_STORE_BUCKET: ${PHOTO_STORE_BUCKET:-supplier-photos}
      PHOTO_STORE_ACCESS_KEY: ${PHOTO_STORE_ACCESS_KEY:-photostoredev}
      PHOTO_STORE_SECRET_KEY: ${PHOTO_STORE_SECRET_KEY:-photostoredev-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SUPPLIER_SERVICE_PORT:-3004}:3002"
    volumes:
      - ./supplier-service/src:/app/src
    depends_on:
      supplier-db:
        condition: service_healthy
      supplier-redis:
        condition: service_healthy

  # Background worker for the supplier queues and the outbox relay (SupplierServiceArchitecture.md
  # §8.1, §8.2). Same image as supplier-service, different command. PORT and USER_SERVICE_URL are set
  # only because supplier-service/src/config.ts validates them at startup; the worker opens no port.
  supplier-worker:
    build:
      context: ./supplier-service
      target: dev
    container_name: foc-supplier-worker
    init: true
    restart: unless-stopped
    command: ["npm", "run", "worker:dev"]
    # Let an in-flight job finish on `docker stop` (Docker's default is SIGKILL after 10 s).
    stop_grace_period: 30s
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: supplier-db
      DB_PORT: 3306
      DB_NAME: supplier_service
      DB_USER: root
      DB_PASSWORD: ${SUPPLIER_DB_PASSWORD}
      REDIS_HOST: supplier-redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:3001
      PHOTO_STORE_ENDPOINT: ${PHOTO_STORE_ENDPOINT:-http://host.docker.internal:9000}
      PHOTO_STORE_BUCKET: ${PHOTO_STORE_BUCKET:-supplier-photos}
      PHOTO_STORE_ACCESS_KEY: ${PHOTO_STORE_ACCESS_KEY:-photostoredev}
      PHOTO_STORE_SECRET_KEY: ${PHOTO_STORE_SECRET_KEY:-photostoredev-secret}
      MOCK_DOWNSTREAM_FAILURE: ${MOCK_DOWNSTREAM_FAILURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./supplier-service/src:/app/src
    depends_on:
      supplier-db:
        condition: service_healthy
      supplier-redis:
        condition: service_healthy

volumes:
  order-db-data:
  user-db-data:
  credit-db-data:
  supplier-db-data:
