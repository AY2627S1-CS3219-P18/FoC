name: foc

services:
  # ---- order-service ----------------------------------------------------------
  order-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_DB_USER:?set ORDER_DB_USER in .env}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      POSTGRES_DB: ${ORDER_DB_NAME:?set ORDER_DB_NAME in .env}
    ports:
      - "${ORDER_DB_PORT:-5433}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: ./order-service
      target: production
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@order-db:5432/${ORDER_DB_NAME}
    ports:
      - "${ORDER_SERVICE_PORT:-3002}:3000"
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  order-db-data:
