#
# Dev override: hot reload via Compose Watch (Docker Compose >= 2.22).
#   docker compose -f compose.yaml -f compose.dev.yaml up --build --watch
#
# Compose Watch copies changed files into the container rather than bind-mounting,
# so file-change events fire reliably on Windows/WSL2 without polling.
#
# Scope (2026-10-19): Added the credit-service proxy target for the frontend's
# environment-configured Vite proxy. No requirements, architecture, schema, or
# API decisions were made by the AI tool.
# Author review: tng wen xi
# Tool: Claude Code (model: claude-opus-5-5), date: 2026-10-22
# Scope (2026-10-22): order-worker serves the read-only bull-board queue dashboard
#        (QUEUE_DASHBOARD_PORT), published on the host's loopback only:
#        http://localhost:3010/admin/queues. No requirements, architecture, schema,
#        or API decisions were made by the AI tool.
# Author review:

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    restart: "no"
    environment:
      NODE_ENV: development
      VITE_SUPPLIER_SERVICE_URL: http://supplier-service:3002
      VITE_USER_SERVICE_URL: http://user-service:3001
      VITE_CREDIT_SERVICE_URL: http://credit-service:3003
      VITE_ORDER_SERVICE_URL: http://order-service:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync+restart
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.js
          target: /app/vite.config.js
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

  order-service:
    build:
      target: dev
    restart: "no"
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./order-service/src
          target: /app/src
          ignore:
            - generated/
        - action: sync
          path: ./order-service/test
          target: /app/test
        # Schema/migration changes: restart -> container re-runs generate + migrate deploy
        - action: sync+restart
          path: ./order-service/prisma
          target: /app/prisma
        - action: rebuild
          path: ./order-service/package.json
        - action: rebuild
          path: ./order-service/package-lock.json

  order-worker:
    build:
      target: dev
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "npx prisma generate && npx prisma migrate deploy && exec npm run worker:dev",
      ]
    environment:
      NODE_ENV: development
      QUEUE_DASHBOARD_PORT: 3010
    ports:
      - "127.0.0.1:3010:3010" # bull-board, this machine only
    develop:
      watch:
        - action: sync
          path: ./order-service/src
          target: /app/src
          ignore:
            - generated/
        - action: sync+restart
          path: ./order-service/prisma
          target: /app/prisma
        - action: rebuild
          path: ./order-service/package.json
        - action: rebuild
          path: ./order-service/package-lock.json
